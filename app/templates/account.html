<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account · {{ app_name }}</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f7fb;color:#172033;font:15px/1.5 Inter,system-ui,sans-serif}.top{background:#111827;color:#fff;padding:18px clamp(20px,5vw,60px);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.brand small{display:block;color:#9ca3af;font-size:11px;text-transform:uppercase}.wrap{max-width:900px;margin:45px auto;padding:0 20px}.card{background:#fff;border:1px solid #dfe4ec;border-radius:16px;padding:25px;box-shadow:0 12px 35px rgba(17,24,39,.07)}h1{margin:0 0 5px}.muted{color:#667085}.notice{margin-top:22px;background:#eef3ff;border:1px solid #c8d6fa;border-radius:11px;padding:15px}button{border:1px solid #475569;background:transparent;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}</style></head><body><header class="top"><div class="brand">{{ app_name }}<small>Smart Job Search · v{{ version }}</small></div><button onclick="logout()">Sign out</button></header><main class="wrap"><section class="card"><h1>Welcome, {{ full_name }}</h1><p class="muted">{{ email }}</p><div class="notice"><strong>Your account is active.</strong><br>Your private workspace will open after the per-user data migration is completed. Until then, administrator data remains isolated and unavailable.</div></section></main><script>async function logout(){await fetch('/auth/logout',{method:'POST'});location.assign('/')}</script></body></html>
