[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/v10_main.py", "app/v11_main.py", "app/v12_main.py", "app/v13_main.py", "app/v14_main.py", "app/v15_main.py"]

[tool.coverage.report]
fail_under = 50
skip_covered = true
show_missing = true
