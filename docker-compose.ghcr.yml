services:
  bert:
    image: ghcr.io/whojan/bert:${BERT_IMAGE_TAG:-latest}
    container_name: bert
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bert_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bert_data:
